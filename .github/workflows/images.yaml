name: Images

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/asus-exporter
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build
        run: docker build --tag "$IMAGE:sha-${GITHUB_SHA::12}" .

      - name: Check the image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id "$IMAGE:sha-${GITHUB_SHA::12}" -u)" = 1000

      - name: Push
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:sha-${GITHUB_SHA::12}"
          if [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
            docker tag "$IMAGE:sha-${GITHUB_SHA::12}" "$IMAGE:$version"
            docker push "$IMAGE:$version"
          fi
          docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-${GITHUB_SHA::12}" >> "$GITHUB_STEP_SUMMARY"
